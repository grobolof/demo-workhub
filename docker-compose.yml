services:

  application:
    image: ghcr.io/grobolof/bitrix:php-8.5-fpm-trixie
    env_file: .env
    working_dir: ${APP_PATH}
    environment:
      PHP_IDE_CONFIG: serverName=${APP_HOST}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./:${APP_PATH}
    depends_on:
      - database
      - elasticsearch

  elasticsearch:
    image: elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  database:
    image: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - ./docker/mariadb/db.sql:/docker-entrypoint-initdb.d/db.sql
      - ./docker/mariadb/bx.cnf:/etc/mysql/conf.d/bx.cnf
    command: >
      bash -c "
        chmod 644 /etc/mysql/conf.d/bx.cnf &&
        chown mysql:mysql /etc/mysql/conf.d/bx.cnf &&
        exec /usr/local/bin/docker-entrypoint.sh mariadbd
      "

  frontend:
    build:
      context: ./frontend
    image: workhub-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://application
    depends_on:
      - application

volumes:
  frontend_modules:
  elasticsearch_data: